<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#232838"/>
      <stop offset="1" stop-color="#0b0d13"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4152"/>
      <stop offset="0.55" stop-color="#262b37"/>
      <stop offset="1" stop-color="#181b23"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b6478"/>
      <stop offset="1" stop-color="#1c2029"/>
    </linearGradient>
    <radialGradient id="stick" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#3b4254"/>
      <stop offset="1" stop-color="#0f1117"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="495" height="495" rx="103.5" fill="none" stroke="#2c3244" stroke-width="3"/>

  <!-- vibration waves -->
  <g fill="none" stroke="#3ccfc0" stroke-linecap="round" filter="url(#glow)">
    <path d="M78 196 Q52 256 78 316" stroke-width="13" stroke-opacity="0.95"/>
    <path d="M46 168 Q10 256 46 344" stroke-width="11" stroke-opacity="0.55"/>
    <path d="M434 196 Q460 256 434 316" stroke-width="13" stroke-opacity="0.95"/>
    <path d="M466 168 Q502 256 466 344" stroke-width="11" stroke-opacity="0.55"/>
  </g>

  <!-- controller body -->
  <g filter="url(#shadow)" transform="rotate(-4 256 270)">
    <path d="M168 176 C150 176 138 184 130 198 C110 236 96 290 94 336 C92 372 112 392 138 388
             C158 385 170 368 184 346 C192 334 202 328 216 328 L296 328 C310 328 320 334 328 346
             C342 368 354 385 374 388 C400 392 420 372 418 336 C416 290 402 236 382 198
             C374 184 362 176 344 176 C326 176 312 186 296 186 L216 186 C200 186 186 176 168 176 Z"
          fill="url(#body)" stroke="url(#rim)" stroke-width="5"/>
    <!-- top highlight -->
    <path d="M168 190 C154 190 146 196 140 206 C150 198 160 196 172 198 C190 200 200 208 216 208 L296 208
             C312 208 322 200 340 198 C352 196 362 198 372 206 C366 196 358 190 344 190 C328 190 314 200 296 200
             L216 200 C198 200 184 190 168 190 Z" fill="#ffffff" fill-opacity="0.07"/>

    <!-- d-pad -->
    <g fill="#11141b" stroke="#454d60" stroke-width="2.5">
      <path d="M156 236 h22 v22 h22 v22 h-22 v22 h-22 v-22 h-22 v-22 h22 Z"/>
    </g>
    <!-- face buttons -->
    <g stroke="#0c0e13" stroke-width="2">
      <circle cx="356" cy="236" r="13" fill="#2f6f6a"/>
      <circle cx="382" cy="262" r="13" fill="#3ccfc0"/>
      <circle cx="330" cy="262" r="13" fill="#4a5266"/>
      <circle cx="356" cy="288" r="13" fill="#4a5266"/>
    </g>
    <!-- sticks -->
    <circle cx="214" cy="318" r="27" fill="#0d0f14"/>
    <circle cx="214" cy="318" r="21" fill="url(#stick)" stroke="#4a5266" stroke-width="2.5"/>
    <circle cx="298" cy="318" r="27" fill="#0d0f14"/>
    <circle cx="298" cy="318" r="21" fill="url(#stick)" stroke="#4a5266" stroke-width="2.5"/>
    <!-- center light -->
    <rect x="240" y="226" width="32" height="8" rx="4" fill="#3ccfc0" filter="url(#glow)"/>
  </g>
</svg>
